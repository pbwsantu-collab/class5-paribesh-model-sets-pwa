.set-btn:hover, .set-btn:focus { border-color: var(--accent); background: #1e3a3a; }

.q-text { margin-bottom: 10px; font-size: .95rem; }
.options { display: flex; flex-direction: column; gap: 6px; }
.opt {
  background: #0f172a; border: 1px solid var(--border);

  font-size: .9rem; transition: .12s; display: flex; align-items: center; gap: 8px;

.opt:hover { border-color: var(--accent); }
.opt.selected { border-color: var(--accent); background: #134e4a; }
.opt.correct { border-color: var(--correct); background: #14532d; }
.opt.wrong { border-color: var(--wrong); background: #450a0a; }
.opt .letter {
  font-weight: 700; min-width: 22px; height: 22px;
  display: grid; place-items: center; border-radius: 50%;
  background: var(--border); font-size: .75rem;

.reveal-btn {
  margin-top: 8px; background: transparent; border: 1px dashed var(--muted);
  color: var(--muted); padding: 6px 12px; border-radius: 6px;
  font-size: .8rem; cursor: pointer;

.reveal-btn:hover { border-color: var(--accent); color: var(--accent); }
.answer-box {
  margin-top: 8px; padding: 10px 12px; background: #134e4a;
  border-left: 3px solid var(--correct); border-radius: 0 8px 8px 0;
  font-size: .9rem; display: none;
}
.answer-box.show { display: block; }
.feedback {
  margin-top: 6px; font-size: .85rem; font-weight: 600;

.feedback.ok { color: var(--correct); }
.feedback.bad { color: var(--wrong); }
.score-bar {
  position: fixed; bottom: 0; left: 0; right: 0;

  padding: 10px 16px; display: flex; justify-content: space-between;

.progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width .3s; }

/* ============================================================
   APP LOGIC
   ============================================================ */
let currentSet = null;
let answered = 0, correct = 0;

const $ = id => document.getElementById(id);
const viewHome = $('viewHome');
const viewSet = $('viewSet');
const setGrid = $('setGrid');
const setContent = $('setContent');
const pageTitle = $('pageTitle');
const scoreBar = $('scoreBar');

function showHome() {
  viewHome.classList.remove('hidden');
  viewSet.classList.add('hidden');
  scoreBar.classList.add('hidden');
  pageTitle.textContent = 'Model Sets EVS';
  currentSet = null;
}

function showSet(id) {
  const set = SETS.find(s => s.id === id);
  if (!set) return;
  currentSet = set;
  answered = 0; correct = 0;
  updateScore();
  viewHome.classList.add('hidden');
  viewSet.classList.remove('hidden');
  scoreBar.classList.remove('hidden');
  pageTitle.textContent = set.title;
  renderSet(set);
  window.scrollTo(0, 0);
}

function updateScore() {
  $('scoreText').textContent = `${correct} / ${answered}`;
  const pct = answered ? Math.round(correct / answered * 100) : 0;
  $('pctText').textContent = pct + '%';
  $('progressFill').style.width = pct + '%';
}

function renderSet(set) {
  let html = `<div class="card"><strong>${set.title}</strong><br><span class="note">Time: 1 hr 30 min · Full Marks: 50</span></div>`;
  set.sections.forEach((sec, si) => {
    html += `<div class="section-title">${sec.title}</div>`;
    sec.qs.forEach((item, qi) => {
      const key = `${set.id}-${si}-${qi}`;
      if (sec.type === 'mcq') {
        html += `<div class="card q-card" data-key="${key}">
          <div class="q-text"><span class="q-num">${item.q.split(' ')[0]}</span>${item.q.replace(/^\d+\.\d+\s*/, '')}</div>
          <div class="options">`;
        item.opts.forEach((o, oi) => {
          html += `<div class="opt" data-oi="${oi}" data-ans="${item.ans}" onclick="selectOpt(this)">
            <span class="letter">${String.fromCharCode(97+oi)}</span> ${o}
          </div>`;
        });
        html += `</div><div class="feedback" id="fb-${key}"></div></div>`;
      } else {
        html += `<div class="card q-card">
          <div class="q-text">${item.q}</div>
          <button class="reveal-btn" onclick="toggleAns(this)">Show Answer</button>
          <div class="answer-box">${item.a || '—'}</div>
        </div>`;
      }
    });
  });
  setContent.innerHTML = html;
}

function selectOpt(el) {
  const card = el.closest('.q-card');
  if (card.dataset.done) return;
  card.dataset.done = '1';
  const ans = +el.dataset.ans;
  const oi = +el.dataset.oi;
  const opts = card.querySelectorAll('.opt');
  opts.forEach(o => {
    o.classList.remove('selected');
    if (+o.dataset.oi === ans) o.classList.add('correct');
  });
  el.classList.add(oi === ans ? 'correct' : 'wrong');
  if (oi !== ans) el.classList.add('selected');
  answered++;
  if (oi === ans) correct++;
  const fb = card.querySelector('.feedback');
  fb.textContent = oi === ans ? '✓ Correct' : '✗ Wrong – correct option highlighted';
  fb.className = 'feedback ' + (oi === ans ? 'ok' : 'bad');
  updateScore();
}

function toggleAns(btn) {
  const box = btn.nextElementSibling;
  box.classList.toggle('show');
  btn.textContent = box.classList.contains('show') ? 'Hide Answer' : 'Show Answer';
}

// Build set grid
SETS.forEach(s => {
  const btn = document.createElement('button');
  btn.className = 'set-btn';
  btn.innerHTML = `Set ${s.id}<small>${s.title.replace('MODEL ','')}</small>`;
  btn.onclick = () => showSet(s.id);
  setGrid.appendChild(btn);
});

$('btnHome').onclick = showHome;
$('btnBackSets').onclick = showHome;
$('btnTheme').onclick = () => {
  document.documentElement.style.filter =
    document.documentElement.style.filter ? '' : 'invert(1) hue-rotate(180deg)';
};

// Minimal PWA: register empty SW so it can be installed
if ('serviceWorker' in navigator) {
  const swCode = `self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('fetch',e=>{});`;
  const blob = new Blob([swCode], {type: 'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}
</script>
